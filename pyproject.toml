[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inarcp"
version = "1.0.0"
description = "Innovation-normalized autoregressive conformal prediction for scalar and complex (radar clutter) episodes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muhammad Umair Raza"}, {name = "Sohail Ahmed"}, {name = "Syed M. Kazam Abbas Kazmi"}, {name = "Muhammad Saad Umer"}, {name = "Zohaib Ahmad Khan"}, {name = "M. Atif Shahzad"}, {name = "Ammad Ahmed"}, {name = "Saqib Amin"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["inarcp"]
